# Synthetic proof game (WP-16). NOT a real game: it exists to prove that a new
# game is added by FILES ONLY. Lives in templates/ so `game_ctl.sh` and the
# default composer directory never offer it for a real run; the onboarding test
# composes it with `--games-dir configs/games/templates`.
game:
  name: synthetic
  env_name: Synthetic-Grid
  backend: plugin
  adapter: "developmental_ai.environments.synthetic_game:SyntheticGameAdapter"
  timing: synchronous               # set `realtime` to exercise the lag contract
  streams: 2
  life_steps: 200
  tics: 3                           # realtime only
  lag_tics: 1                       # realtime only: tics that still run the old slot
  audio: {enabled: false, sample_rate: 22050}
  controller:
    - {}                            # 0 no-op
    - {UP: 1}                       # 1
    - {DOWN: 1}                     # 2
    - {LEFT: 1}                     # 3
    - {RIGHT: 1}                    # 4
    - {TOUCH: 1}                    # 5
  install: {note: "nothing to install (pure Python)"}
primary: {}
